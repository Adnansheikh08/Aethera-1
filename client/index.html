<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Dark, matching `color-scheme: dark` on :root in style.css. This one is
         read before any CSS arrives, so it is what stops the browser painting a
         light canvas for the first frame. -->
    <meta name="color-scheme" content="dark">
    <title>Aethera — Enterprise Software Agency &amp; Cybersecurity</title>
    <meta name="description"
        content="We build secure, high-performance, and ultra-scalable web platforms and enterprise applications aligned to the OWASP ASVS standard.">

    <!-- Preconnect ahead of the font CSS request to remove a round trip from LCP. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- One grotesque for everything — the Swiss way. Inter carries display
         and body (hierarchy comes from size and weight, not a second
         typeface); Space Mono stays for monospaced moments. -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Space+Mono:wght@400;700&display=swap">
    <script>
        (function() {
            // Dark is the default; the toggle opts into .light instead.
            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                document.documentElement.classList.add('light');
            }
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
