user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access_log.log main;

    # Performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Disable version emission

    # Client body limit (Max 5MB uploads as per security spec)
    client_max_body_size 5M;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zones (10 requests per second per IP)
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=10r/s;

    upstream express_api {
        server api:5000;
    }

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Rate Limit check
        limit_req zone=global_limit burst=20 nodelay;

        # Security headers are declared once at server level. add_header in a
        # location block replaces the inherited set rather than adding to it,
        # so the API location below repeats them deliberately.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Vite emits content-hashed filenames into /assets, so a new deploy
        # produces new URLs and these can be cached indefinitely.
        location /assets/ {
            expires 365d;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # The API, including the obfuscated admin prefix. Express owns CORS,
        # CSP and the WAF; nginx only forwards.
        location /api/ {
            proxy_pass http://express_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # The WAF and audit log record req.clientIp from this header, so
            # ban decisions follow the real client and not the proxy.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # index.html must never be cached: it names the hashed bundles, so a
        # stale copy pins visitors to assets that no longer exist.
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Client-side routing. Every unmatched path returns the SPA shell and
        # React Router resolves it — /services, /admin/leads and the rest are
        # real URLs to the browser but not files on disk.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
